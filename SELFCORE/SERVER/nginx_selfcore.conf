# ============================================================
# Nginx Config für GEN:SELFCORE — zweite App auf dem Server
# Datei speichern unter: /etc/nginx/sites-available/selfcore
# ============================================================
#
# VORAUSSETZUNG: Deine andere App läuft schon auf Port 3000.
# GEN:SELFCORE läuft auf Port 3001.
# Diese Config routet api.genselfcore.de → Port 3001
#
# EINRICHTEN:
#   sudo nano /etc/nginx/sites-available/selfcore
#   (diese Datei reinkopieren, dann:)
#   sudo ln -s /etc/nginx/sites-available/selfcore /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d api.genselfcore.de -d genselfcore.de -d www.genselfcore.de
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# API-Server (app.genselfcore.de → Port 3001)
server {
    listen 80;
    server_name api.genselfcore.de;

    location / {
        proxy_pass         http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}

# Website (genselfcore.de → statische Dateien + Referral-Link-Handler)
server {
    listen 80;
    server_name genselfcore.de www.genselfcore.de;

    root /var/www/genselfcore;
    index index.html;

    # Referral-Link: /join?ref=CODE → App Store (mit Code im Cookie)
    location /join {
        # Gibt die index.html zurück, die den ref= Code in Cookie speichert
        # und dann zum App Store weiterleitet
        try_files $uri /join.html;
    }

    # Apple App Site Association (für Universal Links / Deep Links)
    location /.well-known/apple-app-site-association {
        default_type application/json;
        try_files $uri /apple-app-site-association;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
