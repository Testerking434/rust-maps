# GEN:SELFCORE Nginx Config
# api.genselfcore.de -> Port 8001 (Hetzner Server)

server {
    listen 443 ssl;
    server_name api.genselfcore.de;

    ssl_certificate     /etc/letsencrypt/live/api.genselfcore.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.genselfcore.de/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://localhost:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.genselfcore.de;
    return 301 https://$host$request_uri;
}
